# Neither MOSS implementation consumes reference_text; do not transcribe
# reference samples or expose unused transcript storage for these variants.
reference_transcript = false
voice_required = false
language_policy = "moss"
language_target = "options"
menu = [
    { kind = "voice_samples" },
    { parameter = "delay_temperature", label = "Temperature", target_menu = "model" },

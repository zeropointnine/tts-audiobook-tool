# needs the reference clip's exact transcript, so both tokens are claimed; a
# server advertises whichever one its operator configured. Output is fixed at
# 24 kHz, so this family has no samplerate setting like local `glm_local` does,
# and its Flow/DiT controls replace that model's `sr` knob.
[[models]]
id = "glm_tts_audiocpp"
settings = [
    { name = "temperature", section = "parameters", type = "float", default = 1.0 },
    { name = "top_p", section = "parameters", type = "float", default = 0.8 },
    { name = "top_k", section = "parameters", type = "int", default = 25 },
    { name = "num_inference_steps", section = "parameters", type = "int", default = 10 },
    { name = "flow_guidance_scale", section = "parameters", type = "float", default = 0.7 },
    { name = "seed", section = "parameters", type = "int", default = -1, preserve_default = true },
    { name = "file_name", section = "voice_references", type = "list[str]", default = [] },
    { name = "transcript", section = "voice_references", type = "list[str]", default = [] },
]
backend_kind = "audio_cpp"

[models.spec]
file_tag = "glm"
default_output_sample_rate = 24000
un_all_caps = false
requirements_file_name = "requirements-remote.txt"
# Same caesura behavior as local `glm_local`: semicolon generates a random
# syllable; em-dash and space-en-dash-space do not create a caesura.
substitutions = [
    [";", ","],
    ["—", ", "], ["─", ", "],
    [" – ", ", "],
]

[models.spec.ui]
proper_name = "GLM-TTS"
short_name = "GLM"
voice_path_console = "Enter voice clone audio clip file path (transcript required): "
voice_path_requestor = "Select voice clone audio clip (transcript required)"
project_links = [
    "https://github.com/zai-org/GLM-TTS",
    "https://huggingface.co/zai-org/GLM-TTS",
    "https://github.com/0xShug0/audio.cpp/blob/main/docs/community_models/glm_tts.md",
]

[models.audio_cpp]
menu = [
    { kind = "voice_samples" },
    { parameter = "temperature", label = "Temperature", target_menu = "model" },
    { parameter = "top_p", label = "Top-P", target_menu = "model" },
    { parameter = "top_k", label = "Top-K", target_menu = "model" },
    { parameter = "num_inference_steps", label = "Steps", target_menu = "model" },
    { parameter = "flow_guidance_scale", label = "Flow guidance scale", target_menu = "model" },
    { kind = "seed", target_menu = "model" },
]
# The family requires the reference transcript: without it, audio.cpp's GLM-TTS
# session throws before synthesis, and a mismatched transcript degrades both
# semantic and speaker conditioning. A reference clip is always required.
reference_transcript = true
# Same segment recommendation as local `glm_local`.
max_words_range_reco = [20, 40]
# The session never reads a language; send none.
language_policy = "omit"
# No request_options: the session has no internal text chunker, and its
# speech-token budget is already bounded per request (2x-20x text tokens).

[models.audio_cpp.match]
family = "glm_tts"
# audio.cpp advertises whichever task token the operator configured, and this
# family's two advertised routes are the same reference-conditioned path, so
# both spellings are accepted (`tts` is the common server.json value).
tasks = ["tts", "clon"]
mode = "offline"

# temperature 0 selects greedy decoding.
[models.audio_cpp.parameters.temperature]
type = "float"
default = 1.0
min = 0.0
max = 2.0

[models.audio_cpp.parameters.top_p]
type = "float"
default = 0.8
min = 0.0
max = 1.0

[models.audio_cpp.parameters.top_k]
type = "int"
default = 25
min = 0
max = 100
input_prompt_suffix = "(0=disabled)"

# Flow Euler steps; forwarded from the top-level body.
[models.audio_cpp.parameters.num_inference_steps]
type = "int"
default = 10
min = 1
max = 50

# Flow classifier-free guidance. Not one of audio.cpp's forwarded top-level
# request fields (a top-level value is silently ignored), so it travels in
# `options` like Chatterbox's `exaggeration`.
[models.audio_cpp.parameters.flow_guidance_scale]
type = "float"
default = 0.7
min = 0.0
max = 2.0
target = "options"


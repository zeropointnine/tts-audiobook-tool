[models.behavior]
# Does NOT stream in practice, despite the SGL-Omni Qwen3-TTS docs claiming otherwise (as of 2026-06)
streaming = false
seed = "unsupported"
# Historical note said this diverged from the local version. Both current
# catalog entries require voice; keep this policy explicit.

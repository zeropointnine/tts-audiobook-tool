default_sentinel = -1
min = 0.01
max = 1.0

[models.parameters.top_k]
type = "int"
request_key = "top_k"
default = 50
default_sentinel = -1
min = 1
max = 100

[models.parameters.repetition_penalty]
type = "float"
request_key = "repetition_penalty"
default = 1.05
default_sentinel = -1
min = 1.0
max = 2.0
omit_when_unset = true


max = 3.0

[models.audio_cpp.parameters.delay_top_p]
type = "float"
request_key = "top_p"
default = 0.6
default_sentinel = -1
min = 0.5
max = 1.0

[models.audio_cpp.parameters.delay_top_k]
type = "int"
request_key = "top_k"
default = 50
default_sentinel = -1
min = 10
max = 100


[[models]]
id = "omnivoice_audiocpp"
settings = [
    { name = "num_inference_steps", section = "parameters", type = "int", default = 32 },
    { name = "guidance_scale", section = "parameters", type = "float", default = 2.0 },
    { name = "speed", section = "parameters", type = "float", default = 1.0 },
    { name = "instruct", section = "parameters", type = "str", default = "" },
    { name = "seed", section = "parameters", type = "int", default = -1, preserve_default = true },
    { name = "file_name", section = "voice_references", type = "list[str]", default = [] },
    { name = "transcript", section = "voice_references", type = "list[str]", default = [] },
]
backend_kind = "audio_cpp"

[models.spec]
file_tag = "omnivoice"
default_output_sample_rate = 24000
# Matches local `omnivoice_local`, which also neutralizes all-caps text.
un_all_caps = true
requirements_file_name = "requirements-remote.txt"
substitutions = []

[models.spec.ui]
proper_name = "OmniVoice"
short_name = "OmniVoice"
voice_sample_max_duration_s = 15
voice_path_console = "Enter voice clone audio clip file path (3-10s recommended, up to 15s): "
voice_path_requestor = "Select voice clone audio clip (3-10s recommended, up to 15s)"
project_links = [
    "https://github.com/k2-fsa/OmniVoice",
    "https://huggingface.co/k2-fsa/OmniVoice",
    "https://github.com/0xShug0/audio.cpp/blob/main/docs/models/omnivoice.md"
]

[models.audio_cpp]
# Optional in the family, but used when present: the reference transcript
# sharpens speaker/semantic conditioning, and local `omnivoice_local` already
# stores and sends one. OmniVoice's own clone path actually rejects a reference
# WAV without one, so the adapter requires it whenever a sample is configured.
reference_transcript = true

# The family's one `tts` route also accepts a reference-less request: an
# `instruction` selects voice design, and no instruction at all falls through
# to auto voice. Like Breeze, it does not require a reference; a configured-
# but-missing sample file still blocks generation.
voice_required = false

# Local `OmniVoiceModel` hardcodes `AUDIO_CHUNK_THRESHOLD_SECONDS = 999`
# to suppress the model's own long-text chunker, and the app segments text
# itself; this pins the same value instead of exposing a control for it. The
# family chunks text when the estimated audio length exceeds the threshold.
#
# Never add text_chunk_size here: an explicit value inverts the session's
# logic and FORCES the multi-chunk path even for short text.
[models.audio_cpp.request_options]
audio_chunk_threshold = 999.0

[models.audio_cpp.match]
family = "omnivoice"
task = "tts"
mode = "offline"

# Controls default to the family's own values, which are also the local
# model's constants (32 steps, guidance 2.0, speed 1.0).
[models.audio_cpp.parameters.num_inference_steps]
type = "int"
default = 32
min = 8
max = 64

[models.audio_cpp.parameters.guidance_scale]
type = "float"
default = 2.0
min = 0.0
max = 4.0

# audio.cpp's documented "request option" path: the session reads `speed` from
# the request's `options` map, and only the top-level `speed` body field is
# gated on the family's contract, so this travels in `options`.
[models.audio_cpp.parameters.speed]
type = "float"
default = 1.0
min = 0.5
max = 2.0
target = "options"

# Voice-design instruction, the same string local `omnivoice_local` stores. The
# server reads it from `options.instruction` (its top-level `instructions` body
# field is only an alias), and applies it both to an instruction-only request
# and, as a style hint, alongside a cloning reference.
[models.audio_cpp.parameters.instruct]
type = "str"
default = ""
request_key = "instruction"
target = "options"

# Menu order mirrors local `omnivoice_local`: voice samples, then settings
# led by the voice-design instructions.
[[models.audio_cpp.menu]]
kind = "voice_samples"

[[models.audio_cpp.menu]]
kind = "voice_instructions"
target_menu = "voice"
parameter = "instruct"

[[models.audio_cpp.menu]]
parameter = "num_inference_steps"
target_menu = "model"
label = "Steps"

[[models.audio_cpp.menu]]
parameter = "speed"
target_menu = "model"
label = "Speed"

[[models.audio_cpp.menu]]
parameter = "guidance_scale"
target_menu = "model"
label = "Guidance scale"

[[models.audio_cpp.menu]]
kind = "seed"
target_menu = "model"

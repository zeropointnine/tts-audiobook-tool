requires_ffmpeg_libs = false
un_all_caps = true
requirements_file_name = "requirements-vibevoice.txt"
output_filters = []
# Em dash and semicolon often do not create caesuras. A fancy apostrophe
# can cause the rest of a word not to be spoken; ellipsis can badly disrupt
# generation.
substitutions = [
    ["—", ", "], ["─", ", "], [";", ","],
    ["’", "'"],
    ["…", ","], ["...", ","],
]


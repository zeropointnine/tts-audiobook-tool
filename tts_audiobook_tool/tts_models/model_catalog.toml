# Application-shipped model catalog (not a per-project settings file).
# Parsed at import time; keep it valid and restart the application after editing.
# schema_version is the catalog schema, not the saved project schema.
# Model order is significant for built-in handles and matching ties.
# IDs and built-in symbols are stable identities; do not rename them casually.
# Local specs provide model metadata; server entries also declare request behavior and menus.
# Omitting backend_kind is allowed only on the NONE placeholder (TOML has no null).
# `match.model_id_substring` is a case-insensitive upstream model-ID fragment;
# the longest matching fragment wins. `spec.file_tag` determines output naming.
# `spec.substitutions` are ordered [before, after] pairs applied to input text.
# `spec.ui` holds display names, prompts and upstream links, not runtime policy.
# Server `behavior` values select built-in policies, never arbitrary code.
# `parameters` describe request keys, validated defaults/bounds and optional
# sentinel or request caps. `request_defaults` and `request_stream_defaults`
# apply to their respective request modes; they are not project settings.
# `menu` entries are ordered; `parameter` refers to a declared parameter.
# Strings like "resolved" and "omitted" are validated policy names; a -1
# default_sentinel represents an unset persisted preference where supported.
# Comments count toward the raw-file fingerprint checked across processes.
#
# Field notes carried forward from the original hardcoded TtsModelSpec:
# `id`: identifier used for serialization.
# `backend_kind`: the kind of backend executing/serving this variant; the NONE
# placeholder is not a real model and has no backend.
# `match.model_id_substring`: substring for simple SGL-Omni model-name matching.
# `spec.local_module_test`: module name, or "dist:<package>" /
# "dist:<package>==<version>", probing whether the model library exists in this venv.
# `spec.local_torch_devices`: supported torch device types for local inference.
# `spec.file_tag`: identifier used in file names.
# `spec.default_output_sample_rate`: model's native/default sound output sample rate.
# `spec.requires_voice`: whether generation requires a voice clone sample.
# `spec.can_stream`: whether the model supports streaming chunk callbacks.
# `spec.requires_ffmpeg_libs`: FFmpeg shared libraries (dll/so/dylib), not just
# the ffmpeg executable; usually needed because the model depends on TorchCodec.
# `spec.un_all_caps`: forces lowercase on initially all-caps prompts (see
# `un_all_caps_prompt()`); use for models that perform poorly on all-caps text.
# `spec.requirements_file_name`: requirements.txt for the model's virtual environment.
# `spec.ui`: UI-related strings and values.
# `spec.output_filters`: case-sensitive substrings of worker console lines to
# filter out of output history.
# `spec.substitutions`: ordered string-replace pairs, primarily for punctuation
# that a model might disregard or interpret unexpectedly.

schema_version = 3

# ------------------------------------------------------------------------
# none: The NONE handle is a placeholder, not an inference backend. TOML has no null; only this entry
# omits backend_kind.
# Placeholder model type when no other models are detected
[[models]]
id = "none"
symbol = "NONE"

# Not a real model: no backend. In SGL-Omni mode the placeholder
# means "server not configured"; in local mode it means "no TTS
# model library in the venv".
[models.spec]
local_module_test = ""
local_torch_devices = []
file_tag = ""
default_output_sample_rate = 0
requires_voice = false
can_stream = false
requires_ffmpeg_libs = false
un_all_caps = false
# Only meaningful in SGL-Omni mode ("server not configured"); in local
# mode there is no TTS model in the venv. Consumers presenting this file are
# mode-aware (see Tts.get_requirements_file_name()).
requirements_file_name = "requirements-sgl-omni.txt"
output_filters = []
substitutions = []

[models.spec.ui]
proper_name = "None"
short_name = "None"
voice_path_console = ""
voice_path_requestor = ""
project_links = [
    "https://www.example.com",
]

# ------------------------------------------------------------------------
[[models]]
id = "server_auk"
symbol = "AUK_SERVER"
backend_kind = "sgl_omni"

[models.match]
# Generic AuK match. The longer AuK-Flash substring below wins when both match.
model_id_substring = "auk"

[models.spec]
file_tag = "auk"
default_output_sample_rate = 24000
un_all_caps = false
substitutions = []
requirements_file_name = "requirements-sgl-omni.txt"

[models.spec.ui]
proper_name = "AuK"
short_name = "AuK"
voice_path_console = "Enter voice clone audio clip file path (~5s recommended): "
voice_path_requestor = "Select voice clone audio clip (~5s recommended)"
project_links = [
    "https://github.com/Tencent-Hunyuan/AuK",
    "https://huggingface.co/tencent/AuK",
    "https://sgl-project.github.io/sglang-omni/cookbook/auk.html",
]

[models.behavior]
streaming = false
seed = "resolved"
voice_required = true
transcript = "required_when_voice_present"
prompt_policy = "auk_seconds"

[models.request_defaults]
response_format = "wav"

[models.parameters]

[models.parameters.speed]
type = "float"
request_key = "speed"
default = 1.0
min = 0.5
max = 2.0

[[models.menu]]
kind = "voice_samples"

[[models.menu]]
parameter = "speed"
label = "Speech speed"
group = "advanced"

[[models.menu]]
kind = "seed"


# Application-shipped model catalog, replacing values hardcoded in TtsModelSpec.
# Not a per-project settings file; schema_version is independent of project versions.
# Loaded at import time: restart the application after editing.
#
# IDs use modelname_<local|sglomni|audiocpp> (except none); lookups return canonical handles.
# require_by_id(id) is strict; get_by_id(id) falls back to none for unknown external IDs.
# Order: none, then local/sglomni/audiocpp groups sorted by model name.
# `spec` holds model metadata; backend tables hold matching and request configuration.
# Optional `spec.ui.voice_sample_max_duration_s` is the upper duration advised by
# the voice-path guidance (including "up to" limits); it only warns, never rejects samples.
# audio.cpp `match` accepts either `task = "<token>"` or, when a family's routes are the
# same inference path, `tasks = [...]` of the tokens a server may advertise.
# `settings` declares persisted values separately from request defaults.
# audio.cpp requires an explicit `menu`; numeric controls require a nonempty `label`.
# Both server backends require `target_menu = "model"` or "voice" on settings controls.
# `voice_samples` has no target: it always expands in Voice clone.
# audio.cpp `request_options` pins constants into every request's `options` object;
# they are not persisted and have no menu control, unlike `parameters` entries.
# Shared settings use explicit `setting_groups`; their declarations must agree.
# The full file, including comments, is fingerprinted for cross-process consistency.

schema_version = 1

[setting_groups]
auk = ["auk_sglomni", "auk_flash_sglomni"]
qwen3 = ["qwen3tts_local", "qwen3tts_sglomni"]

# ------------------------------------------------------------------------
# none: This handle is a placeholder, not an inference backend. TOML has no null; only this entry
# omits backend_kind.
# Placeholder model type when no other models are detected
[[models]]
id = "none"

# Not a real model: no backend. In SGL-Omni mode the placeholder
# means "server not configured"; in local mode it means "no TTS
# model library in the venv".
[models.spec]
local_module_test = ""
local_torch_devices = []
file_tag = ""
default_output_sample_rate = 0
requires_voice = false
can_stream = false
requires_ffmpeg_libs = false
un_all_caps = false
# Only meaningful in SGL-Omni mode ("server not configured"); in local
# mode there is no TTS model in the venv. Consumers presenting this file are
# mode-aware (see Tts.get_requirements_file_name()).
requirements_file_name = "requirements-remote.txt"
output_filters = []
substitutions = []

[models.spec.ui]
proper_name = "None"
short_name = "None"
voice_path_console = ""
voice_path_requestor = ""
project_links = [
    "https://www.example.com",
]

